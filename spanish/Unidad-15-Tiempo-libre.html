<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unidad 15 · Mi tiempo libre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  /* Layout: a Spanish cuaderno de cuadrícula desk: header rail, one paper card per slide, footer nav rail */
  --paper:#f5f7fc; --grid:#e2e8f4; --card:#ffffff; --ink:#18223d; --muted:#535e7a; --line:#d2daea;
  --accent:#2d55c8; --accent-soft:#e7edfc; --on-accent:#ffffff;
  --ok:#157a45; --ok-soft:#e0f3e7; --bad:#b9302a; --bad-soft:#fbe4e1;
  --c1:#e2483d; --c2:#ee9b14; --c3:#36a253; --c4:#2d6fd6; --c5:#8a4fd1; --c6:#e0588f;
  --shadow:0 1px 0 rgba(24,34,61,.06), 0 14px 34px -14px rgba(24,34,61,.28);
  --display:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root.u15{ --accent:#bf4418; --accent-soft:#fbeae2; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11162a; --grid:#1a2138; --card:#1a2137; --ink:#e9edf8; --muted:#a4adc7; --line:#2f3956;
    --accent:#88a6ff; --accent-soft:#222e52; --on-accent:#0d1326;
    --ok:#62d398; --ok-soft:#14352a; --bad:#ff8c80; --bad-soft:#3d1d1d;
    --c1:#ff6b5e; --c2:#ffb547; --c3:#5cc879; --c4:#5b93ff; --c5:#b083ff; --c6:#ff80b3;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  :root.u15:not([data-theme="light"]){ --accent:#ff9c6e; --accent-soft:#3b2319; }
}
:root[data-theme="dark"]{
  --paper:#11162a; --grid:#1a2138; --card:#1a2137; --ink:#e9edf8; --muted:#a4adc7; --line:#2f3956;
  --accent:#88a6ff; --accent-soft:#222e52; --on-accent:#0d1326;
  --ok:#62d398; --ok-soft:#14352a; --bad:#ff8c80; --bad-soft:#3d1d1d;
  --c1:#ff6b5e; --c2:#ffb547; --c3:#5cc879; --c4:#5b93ff; --c5:#b083ff; --c6:#ff80b3;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root.u15[data-theme="dark"]{ --accent:#ff9c6e; --accent-soft:#3b2319; }

html,body{height:100%}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--card); border-bottom:1px solid var(--line);
}
.bar.foot{border-bottom:0;border-top:1px solid var(--line);justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.progress{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.score{font-family:var(--display);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score svg{width:22px;height:22px;fill:var(--c2)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

.nav{font-family:var(--display);font-weight:700;font-size:1.15rem;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;background:var(--accent-soft);color:var(--ink)}
.nav.next{background:var(--accent);color:var(--on-accent)}
.nav:disabled{opacity:.35;cursor:default}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;text-align:center}
.counter kbd{font-family:var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.8rem}

.stage{overflow:auto;padding-block:clamp(14px,3vh,36px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
.slide{
  margin:auto;width:100%;max-width:1040px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:clamp(14px,2.4vh,26px);min-width:0;
  animation:in .28s ease both;
}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1,h2{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.4vw,2.6rem);font-weight:700}
.hint{margin:0;color:var(--muted)}
.lead{margin:0;font-size:clamp(1.1rem,2vw,1.4rem);max-width:60ch;color:var(--muted)}

/* title slide */
.s-title{gap:22px}
.crayons{display:flex;gap:8px;height:16px}
.crayons i{flex:1;border-radius:99px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.chips li{border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700}

/* prompt */
.prompt{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.8rem);line-height:1.2;margin:0;text-wrap:balance;display:flex;flex-direction:column;gap:4px}
.prompt .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt .sub{font-family:var(--body);font-weight:400;font-size:.55em;color:var(--muted)}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--accent);text-align:center;color:var(--accent);padding:0 6px}
.blank.filled{border-color:var(--ok);color:var(--ok)}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(4rem,12vw,8rem);line-height:1;color:var(--accent)}
.bigemoji{font-size:clamp(3.5rem,10vw,6rem);line-height:1}
.passage{background:var(--accent-soft);border-radius:14px;padding:14px 18px;font-size:1.02rem;max-width:75ch}
.passage b{color:var(--accent)}

/* options */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;min-width:0;
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px;
  font-size:clamp(1.15rem,2.2vw,1.6rem);font-weight:700;transition:transform .12s ease,border-color .12s ease;
}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.opt .key{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.8em;color:#fff;background:var(--k,var(--accent))}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:nth-child(1){--k:var(--c4)} .opt:nth-child(2){--k:var(--c1)} .opt:nth-child(3){--k:var(--c3)} .opt:nth-child(4){--k:var(--c5)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .key{background:var(--bad)}
.opt.dim{opacity:.45}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.shake{animation:shake .35s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.feedback{min-height:1.6em;font-size:clamp(1.05rem,1.9vw,1.3rem);font-weight:700;margin:0}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.feedback .why{display:block;font-weight:400;color:var(--muted);font-size:.9em}

/* typed answer */
.typerow{display:flex;gap:12px;flex-wrap:wrap}
.typerow input{flex:1;min-width:0;font:inherit;font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:700;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.typerow input:focus{outline:none;border-color:var(--accent)}
.typerow input.ok{border-color:var(--ok);background:var(--ok-soft)} .typerow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{font-family:var(--display);font-weight:700;font-size:1.15rem;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:2.2em;padding:4px 8px;font-weight:700;cursor:pointer;font-size:1.1rem}

/* flash cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{perspective:900px;min-height:132px;cursor:pointer;border-radius:16px}
.card .in{position:relative;height:100%;min-height:132px;transition:transform .45s ease;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.face.front{background:var(--card);border-top:8px solid var(--k,var(--accent))}
.face.back{background:var(--accent-soft);transform:rotateY(180deg)}
.face .es{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,1.9vw,1.45rem);line-height:1.15}
.face .en{font-size:1.1rem;font-weight:700}
.face .tap{font-size:.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.cards .card:nth-child(6n+1){--k:var(--c1)} .cards .card:nth-child(6n+2){--k:var(--c2)} .cards .card:nth-child(6n+3){--k:var(--c3)}
.cards .card:nth-child(6n+4){--k:var(--c4)} .cards .card:nth-child(6n+5){--k:var(--c5)} .cards .card:nth-child(6n+6){--k:var(--c6)}
.say{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:8px;display:inline-grid;place-items:center;color:var(--accent);vertical-align:middle}
.say svg{width:1.1em;height:1.1em;min-width:22px;min-height:22px;fill:none;stroke:currentColor;stroke-width:2}
.say:hover{background:var(--accent-soft)}

/* learn */
.learn{display:flex;flex-direction:column;gap:16px;font-size:clamp(1.05rem,1.8vw,1.3rem)}
.learn p{margin:0;max-width:65ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{border:2px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.box h3{margin:0 0 8px;font-family:var(--display);font-size:1.3rem}
.box ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.tw{overflow-x:auto}
table.conj{border-collapse:collapse;width:100%;font-size:clamp(1.05rem,1.9vw,1.35rem)}
table.conj th,table.conj td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
table.conj th{font-family:var(--display);color:var(--muted);font-weight:700}
.end-o{color:var(--accent);font-weight:700}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.learn:not(.shown) .reveal{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.learn:not(.shown) .reveal *{color:transparent}

/* conjugation rows */
.verbhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.verbhead .v{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);color:var(--accent);line-height:1}
.verbhead .m{color:var(--muted);font-size:1.2rem}
.crow{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:14px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.crow .pr{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.8rem)}
.crow .ch{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px;font-weight:700;font-size:clamp(1.1rem,2vw,1.4rem);cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip:disabled{cursor:default}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.chip.dim{opacity:.4}

/* build (order tiles) */
.target{min-height:76px;border:2px dashed var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.target.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.target.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.target .empty{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:clamp(1.15rem,2.2vw,1.6rem);cursor:pointer}
.tile.letter{min-width:2.2em;font-family:var(--display)}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile.used{visibility:hidden}
.tile.in-target{background:var(--accent-soft)}

/* true / false */
.tfrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding-block:12px;border-top:1px solid var(--line);font-size:clamp(1.1rem,2vw,1.4rem)}
.tfrow .ch{display:flex;gap:8px}
.tfrow .mark{font-weight:700}

/* pencils */
.pencils{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;max-width:760px}
.pencils svg{width:26px;height:96px}

/* end */
.stars{display:flex;gap:10px}
.stars svg{width:clamp(56px,9vw,90px);height:auto;fill:var(--line)}
.stars svg.on{fill:var(--c2);animation:pop .5s ease both}
.stars svg.on:nth-child(2){animation-delay:.15s}.stars svg.on:nth-child(3){animation-delay:.3s}
.bigscore{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-wrap:wrap;gap:8px}
.review button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer}

@media (max-width:640px){
  body{font-size:16px}
  .bar{flex-wrap:nowrap;gap:8px}
  .progress{min-width:30px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card,.card .in{min-height:112px}
  .opts{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr;gap:8px}
  .tfrow{grid-template-columns:1fr}
  .brand small{display:none}
  .nav{padding:10px 16px}
  .counter kbd,.counter .keys{display:none}
  .fs-label{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Este juego necesita JavaScript activado.</p></noscript>
<script>
/* Unidad 15 · ¿Qué te gusta hacer en tu tiempo libre? (La Pandilla 1)
   In every "options" list, the FIRST option is the correct one (the game shuffles them). */
var LEA_TEXT = '«¡Hola! Me llamo Lea. En mi tiempo libre <b>me gusta mucho</b> dibujar y leer. <b>Me gusta poco</b> ver la tele y <b>no me gusta nada</b> hacer la cama. <b>Sé</b> patinar, pero <b>no sé</b> tocar el violín. Mi amigo Juan <b>sabe</b> tocar la guitarra y <b>le gusta</b> mucho ir al parque.»';

window.LESSON = {
  theme: 'u15',
  course: 'La Pandilla 1 · Unidad 15',
  short: 'Mi tiempo libre',
  slides: [
    { type: 'title', eyebrow: 'La Pandilla 1 · Unidad 15', title: '¿Qué te gusta hacer en tu tiempo libre?',
      subtitle: 'Las actividades de tiempo libre, cuánto nos gustan y lo que sabemos hacer.',
      chips: ['Vocabulario', 'mucho · poco · nada', 'gustar: me · te · le', 'saber: sé · sabes · sabe'] },

    { type: 'cards', title: 'Mi vocabulario', heading: 'Cosas que me gusta hacer (1)',
      cards: [['leer', 'to read'], ['dibujar', 'to draw'], ['cantar', 'to sing'], ['bailar', 'to dance'], ['patinar', 'to skate'], ['nadar', 'to swim'], ['cocinar', 'to cook']] },
    { type: 'cards', title: 'Mi vocabulario', heading: 'Cosas que me gusta hacer (2)',
      cards: [['silbar', 'to whistle'], ['jugar al fútbol', 'to play football'], ['montar en bici', 'to ride a bike'], ['ver la tele', 'to watch TV'], ['escuchar música', 'to listen to music'], ['ir al parque', 'to go to the park']] },
    { type: 'cards', title: 'Mi vocabulario', heading: 'Cosas que me gusta hacer (3)',
      cards: [['ir al cine', 'to go to the cinema'], ['tocar la guitarra', 'to play the guitar'], ['tocar la batería', 'to play the drums'], ['tocar el violín', 'to play the violin'], ['hacer la cama', 'to make the bed'], ['hacer los deberes', 'to do homework']] },
    { type: 'cards', title: 'Mi vocabulario', heading: '¿Cuánto me gusta?',
      cards: [['😍 Me gusta mucho.', 'I like it a lot.'], ['🙂 Me gusta poco.', 'I like it a little.'], ['🙁 No me gusta nada.', "I don't like it at all."]] },

    { type: 'mc', title: 'Vocabulario', prompt: '¿Qué significa «silbar»?', say: 'silbar',
      options: ['to whistle', 'to sing', 'to swim', 'to skate'] },
    { type: 'mc', title: 'Vocabulario', prompt: '¿Cómo se dice «to do homework»?',
      options: ['hacer los deberes', 'hacer la cama', 'ver la tele', 'leer'] },
    { type: 'mc', title: 'Vocabulario', prompt: '¿Cómo se dice «to play the drums»?',
      options: ['tocar la batería', 'tocar la guitarra', 'tocar el violín', 'jugar al fútbol'] },
    { type: 'type', title: 'Reto 1 · Completa la palabra', prompt: 'dibu_ar', sub: 'Escribe la palabra completa.', answer: ['dibujar'], say: 'dibujar' },
    { type: 'type', title: 'Reto 1 · Completa la palabra', prompt: 'sil_ar', sub: 'Escribe la palabra completa.', answer: ['silbar'], say: 'silbar' },
    { type: 'type', title: 'Reto 1 · Completa la palabra', prompt: 'tocar el vi_lín', sub: 'Escribe la palabra completa.', answer: ['tocar el violín'], say: 'tocar el violín',
      explain: 'Violín lleva tilde en la í.' },

    { type: 'learn', title: 'Gramática', heading: 'Gustar: me · te · le', reveal: true,
      html:
        '<p>Para hablar de actividades decimos <b>gusta</b> + el verbo sin cambiar: «Me gusta bailar».</p>' +
        '<div class="tw"><table class="conj"><tbody>' +
        '<tr><th>(a mí)</th><td><span class="reveal end-o">me</span> gusta bailar</td><td>I like</td></tr>' +
        '<tr><th>(a ti)</th><td><span class="reveal end-o">te</span> gusta bailar</td><td>you like</td></tr>' +
        '<tr><th>(a él / a ella / a usted)</th><td><span class="reveal end-o">le</span> gusta bailar</td><td>he / she likes · you like</td></tr>' +
        '</tbody></table></div>' +
        '<p class="note">Con un nombre ponemos <b>a</b>: «<b>A</b> Juan le gusta ir al cine». Y <b>a + el = al</b>: ir al parque, jugar al fútbol.</p>' },
    { type: 'conj', title: 'Conjugación', heading: '¿Me, te o le?', verb: 'gustar', meaning: 'to like',

          if (flash && flash.i === i && flash.key === ri && picked === k) cls += o === r.ok ? ' pop' : ' shake';
          return h('button', { type: 'button', class: cls, disabled: ans, onclick: function () {
            if (st[i].rows[ri] != null) return; st[i].rows[ri] = k; done(i, o === r.ok, ri);
          } }, [o]);
        }))
      ]);
    });
    var all = Object.keys(S.rows).length === s.rowsX.length;
    var allOk = all && pointsOf(i) === s.rowsX.length;
    var head = h('div', { class: 'verbhead' }, [h('span', { class: 'v' }, [s.verb]), h('span', { class: 'm' }, [s.meaning]), sayBtn(s.forms.join(', '))]);
    return [h('h2', {}, [s.heading || 'Conjuga el verbo']), head, h('p', { class: 'hint' }, [s.hint || 'Elige la forma correcta para cada persona.']),
      h('div', {}, rows), all ? feedback(allOk ? true : false, s.forms.join(' · '), s.explain) : feedback(null)];
  }

  function rBuild(s, S, i) {
    S.seq = S.seq || [];
    var res = S.result;
    var sep = s.letters ? '' : ' ';
    var target = h('div', { class: 'target' + (res ? ' ' + res : '') + (flash && flash.i === i ? (res === 'ok' ? ' pop' : ' shake') : ''), 'aria-label': 'Tu respuesta' },
      S.seq.length ? S.seq.map(function (pi, pos) {
        return h('button', { type: 'button', class: 'tile in-target' + (s.letters ? ' letter' : ''), disabled: !!res, title: 'Quitar',
          onclick: function () { st[i].seq.splice(pos, 1); render(); } }, [s.pool[pi]]);
      }) : [h('span', { class: 'empty' }, [s.letters ? 'Toca las letras en orden…' : 'Toca las palabras en orden…'])]);
    var pool = h('div', { class: 'pool' }, s.pool.map(function (t, pi) {
      var used = S.seq.indexOf(pi) !== -1;
      return h('button', { type: 'button', class: 'tile' + (s.letters ? ' letter' : '') + (used ? ' used' : ''), disabled: used || !!res, 'aria-hidden': used ? 'true' : null,
        onclick: function () { st[i].seq.push(pi); render(); } }, [t]);
    }));
    var answerText = s.letters ? s.answer : s.tiles.join(' ');
    function check() {
      var built = S.seq.map(function (pi) { return s.pool[pi]; }).join(sep);
      var accepted = [answerText].concat(s.alts || []);
      var good = accepted.some(function (a) { return norm(a) === norm(built); });
      st[i].result = good ? 'ok' : 'bad';
      done(i, good);
    }
    var tools = res ? null : h('div', { class: 'tools' }, [
      h('button', { type: 'button', class: 'btn', disabled: !S.seq.length, onclick: check }, ['Comprobar']),
      h('button', { type: 'button', class: 'btn soft', disabled: !S.seq.length, onclick: function () { st[i].seq = []; render(); } }, ['Borrar'])
    ]);
    var p = promptEl(s.prompt, null, s.sub);
    return [p, target, res ? null : pool, tools,
      res ? feedback(res === 'ok', answerText, s.explain) : feedback(null)];
  }

  function rTF(s, S, i) {
    S.ans = S.ans || {};
    var rows = s.statements.map(function (x, ri) {
      var a = S.ans[ri], ans = a != null;
      function b(val, label) {
        var cls = 'chip';
        if (ans) cls += val === x[1] ? ' ok' : (a === val ? ' bad' : ' dim');
        if (flash && flash.i === i && flash.key === ri && a === val) cls += a === x[1] ? ' pop' : ' shake';
        return h('button', { type: 'button', class: cls, disabled: ans, onclick: function () { if (st[i].ans[ri] != null) return; st[i].ans[ri] = val; done(i, val === x[1], ri); } }, [label]);
      }
      return h('div', { class: 'tfrow' }, [h('span', {}, [x[0]]), h('div', { class: 'ch' }, [b(true, 'Verdad'), b(false, 'Mentira')])]);
    });
    var all = Object.keys(S.ans).length === s.statements.length;
    return [h('h2', {}, [s.heading || '¿Verdad o mentira?']), s.passage ? h('div', { class: 'passage', html: s.passage }) : null,
      h('div', {}, rows), all ? h('p', { class: 'feedback ' + (pointsOf(i) === s.statements.length ? 'ok' : 'bad') }, [pointsOf(i) + ' de ' + s.statements.length + ' correctas. ' + (pointsOf(i) === s.statements.length ? pick(PRAISE) : 'Las respuestas correctas están en verde.')]) : feedback(null)];
  }

  function rEnd() {
    var t = totals();
    var pct = t.max ? t.got / t.max : 0;
    var n = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : t.got > 0 ? 1 : 0;
    var stars = h('div', { class: 'stars', 'aria-label': n + ' de 3 estrellas' }, [0, 1, 2].map(function (k) {
      var w = h('span', { html: STAR }); var svg = w.firstChild; if (k < n) svg.setAttribute('class', 'on'); return svg;
    }));
    var missed = [];
    slides.forEach(function (s, i) { if (itemsOf(s) && pointsOf(i) < itemsOf(s)) missed.push(i); });
    var msg = n === 3 ? '¡Eres una superexploradora!' : n === 2 ? '¡Muy buen trabajo!' : '¡Buen intento! Vamos a repasar.';
    return [
      h('p', { class: 'eyebrow' }, ['Fin · ' + L.short]),
      h('h1', {}, [msg]), stars,
      h('p', { class: 'bigscore' }, [t.got + ' / ' + t.max]),
      h('p', { class: 'hint' }, [t.done < t.max ? 'Respuestas correctas (quedan ' + (t.max - t.done) + ' preguntas sin contestar).' : 'Respuestas correctas.']),
      missed.length ? h('div', {}, [h('p', { class: 'hint', style: 'margin-bottom:8px' }, ['Para repasar:']),
        h('div', { class: 'review' }, missed.map(function (i) { return h('button', { type: 'button', onclick: function () { go(i); } }, ['Diapositiva ' + (i + 1) + (slides[i].title ? ' · ' + slides[i].title : '')]); }))]) : null,
      h('div', { class: 'tools' }, [h('button', { type: 'button', class: 'btn', onclick: restart }, ['Jugar otra vez']),
        h('span', { class: 'hint' }, ['Las respuestas cambian de sitio cada vez.'])])
    ];
  }

  /* ---------- frame ---------- */
  function render() {
    var s = slides[idx], S = st[idx];
    var t = totals();
    var body;
    switch (s.type) {
      case 'title': body = rTitle(s); break;
      case 'cards': body = rCards(s, S); break;
      case 'learn': body = rLearn(s, S); break;
      case 'mc': body = rMC(s, S, idx); break;
      case 'type': body = rType(s, S, idx); break;
      case 'conj': body = rConj(s, S, idx); break;
      case 'build': body = rBuild(s, S, idx); break;
      case 'tf': body = rTF(s, S, idx); break;
      default: body = rEnd();
    }
    var slideKids = [];
    if (s.title && s.type !== 'title' && s.type !== 'end') slideKids.push(h('p', { class: 'eyebrow' }, [s.title]));
    slideKids = slideKids.concat(body);
    var keepAnim = !flash;
    var slide = h('section', { class: 'slide', 'aria-label': 'Diapositiva ' + (idx + 1) + ' de ' + slides.length, style: keepAnim ? null : 'animation:none' }, slideKids);

    var fsOk = !!(document.documentElement.requestFullscreen);
    var bar = h('header', { class: 'bar' }, [
      h('div', { class: 'brand' }, [h('small', {}, [L.course]), L.short]),
      h('div', { class: 'progress', role: 'progressbar', 'aria-label': 'Progreso', 'aria-valuemin': '0', 'aria-valuemax': String(slides.length), 'aria-valuenow': String(idx + 1) },
        [h('span', { style: 'width:' + Math.round((idx + 1) / slides.length * 100) + '%' })]),
      h('div', { class: 'score', title: 'Respuestas correctas', 'aria-label': t.got + ' respuestas correctas', html: STAR + '<span>' + t.got + '</span>' }),
      fsOk ? h('button', { type: 'button', class: 'icon-btn', title: 'Pantalla completa', onclick: toggleFs,
        html: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="fs-label">' + (document.fullscreenElement ? 'Salir' : 'Pantalla completa') + '</span>' }) : null,
      h('button', { type: 'button', class: 'icon-btn', title: 'Empezar de nuevo', onclick: restart,
        html: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg><span class="fs-label">Reiniciar</span>' })
    ]);
    var foot = h('footer', { class: 'bar foot' }, [
      h('button', { type: 'button', class: 'nav', id: 'prev', disabled: idx === 0, onclick: function () { go(idx - 1); } }, ['← Atrás']),
      h('div', { class: 'counter' }, [h('strong', {}, [String(idx + 1)]), ' / ' + slides.length, h('span', { class: 'keys' }, ['  ·  teclas ', h('kbd', {}, ['←']), ' ', h('kbd', {}, ['→'])])]),
      h('button', { type: 'button', class: 'nav next', id: 'next', disabled: idx === slides.length - 1, onclick: function () { go(idx + 1); } }, [idx === slides.length - 2 ? 'Ver resultado →' : 'Siguiente →'])
    ]);
    var stage = h('main', { class: 'stage' }, [slide]);
    var focusedId = document.activeElement && document.activeElement.id;
    app.replaceChildren(bar, stage, foot);
    if (focusedId === 'next' || focusedId === 'prev') { var f = document.getElementById(focusedId); if (f && !f.disabled) f.focus(); }
    flash = null;
  }

  function go(n) {
    if (n < 0 || n >= slides.length) return;
    idx = n;
    if (canSpeak) try { window.speechSynthesis.cancel(); } catch (e) {}
    render();
    var stg = app.querySelector('.stage'); if (stg) stg.scrollTop = 0;
    if (slides[idx].type === 'type') { var inp = document.getElementById('ans-' + idx); if (inp && !inp.disabled) inp.focus({ preventScroll: true }); }
  }
  function restart() { setup(); idx = 0; render(); }
  function toggleFs() {
    try {
      var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('fullscreenchange', function () { render(); });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      // Presenter clickers (PageUp/PageDown) always move; arrows move only while the box is empty.
      var arrow = e.key === 'ArrowRight' || e.key === 'ArrowLeft';
      if (!(e.key === 'PageDown' || e.key === 'PageUp' || (arrow && !e.target.value))) return;
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(idx - 1); }
    else if (/^[1-4]$/.test(e.key) && slides[idx].type === 'mc') {
      var b = app.querySelector('.opt[data-k="' + (Number(e.key) - 1) + '"]'); if (b && !b.disabled) b.click();
    }
  });
  var tx = null, ty = null;
  document.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
  if (canSpeak) try { window.speechSynthesis.getVoices(); } catch (e) {}

  setup();
  render();
})();

</script>
</body>
</html>
