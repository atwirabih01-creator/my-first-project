<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zaki Preview</title>
<!--
  Zaki: clickable design preview.
  Everything is scripted. No real AI, no network, no real data.
  Plain ES5 JavaScript and conservative CSS so it runs on older iPhone Safari.
-->
<style>
:root{
  --bg:#EAF6F7; --ink:#1E3A4C; --ink2:#4B6575; --card:#FFFFFF;
  --teal:#2A9DAA; --teal-d:#1F7F8A; --teal-l:#D8F1F3;
  --sun:#FFC857; --sun-l:#FFF4D6; --coral:#FF8A65; --green:#3DAA6D; --green-l:#E2F5EA;
  --lilac:#8E7CC3; --line:#D5E5EA; --help:#5B7FD6; --help-l:#E9EFFC;
  --wa-bg:#ECE5DD; --wa-me:#DCF8C6; --wa-head:#075E54;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#CFE8EC;background-image:linear-gradient(160deg,#D8F1F3 0%,#FFF4D6 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
html[lang="ar"] body{font-size:18px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Phone frame: full screen on phones, a centered phone on desktop */
.phone{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100%}
  .phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 32px);
    border-radius:44px;border:10px solid #1F2A37;box-shadow:0 20px 60px rgba(30,58,76,.35)}
}

/* Top area */
.banner{background:var(--sun);color:#5A4300;font-size:13px;font-weight:700;text-align:center;padding:4px 10px;flex-shrink:0}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;font-weight:800;font-size:20px;color:var(--teal-d)}
.brand svg{margin-inline-end:6px;margin-right:6px}
html[dir="rtl"] .brand svg{margin-right:0;margin-left:6px}
.langbtn{border:2px solid var(--teal);background:var(--teal-l);color:var(--teal-d);font-weight:700;border-radius:22px;padding:6px 14px;min-height:44px}
.seen{background:var(--teal-l);color:var(--teal-d);font-size:14px;font-weight:600;text-align:center;padding:5px 10px;flex-shrink:0}
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.main.lessonmode{overflow:hidden}
.pad{padding:16px}

/* Tab bar */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;padding:6px 2px 8px;min-height:62px;font-size:12px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tab .ic{font-size:22px;line-height:1.2}
.tab.on{color:var(--teal-d)}
.tab.on .ic{background:var(--teal-l);border-radius:14px;padding:0 10px}

/* Generic pieces */
h1{font-size:24px;margin:0 0 4px} h2{font-size:19px;margin:18px 0 8px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:15px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 0 var(--line);margin-bottom:14px}
.big{display:block;width:100%;min-height:64px;border:0;border-radius:22px;font-size:20px;font-weight:800;padding:12px 18px;margin:8px 0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.big:active{-webkit-transform:translateY(2px);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.b-teal{background:var(--teal);color:#fff}
.b-sun{background:var(--sun);color:#4A3700}
.b-white{background:#fff;color:var(--ink);border:2px solid var(--line)}
.b-help{background:var(--help-l);color:#2F4FA0;border:2px solid #BFD0F5}
.b-green{background:var(--green);color:#fff}
.mid{min-height:52px;font-size:17px;border-radius:18px}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:14px;padding:8px 6px;min-height:40px}
.row{display:flex;align-items:center}
.row > .grow{flex:1}
.center{text-align:center}
.muted{color:var(--ink2);font-size:14px}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700}
.st-new{background:#EEF1F4;color:#4B6575}.st-learning{background:var(--sun-l);color:#7A5A00}
.st-learned{background:var(--green-l);color:#1F6E43}.st-mastered{background:#EDE7FA;color:#5A45A0}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:15px;z-index:20;text-align:center;
  -webkit-animation:pop .2s ease-out;animation:pop .2s ease-out}
@-webkit-keyframes pop{from{opacity:0;-webkit-transform:translateY(8px)}to{opacity:1;-webkit-transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Fractions drawn as stacked numbers (no bidi problems in Arabic) */
.frac{display:inline-block;vertical-align:middle;text-align:center;line-height:1;margin:0 .15em;direction:ltr;font-weight:800}
.frac .fn{display:block;border-bottom:2px solid currentColor;padding:0 .2em .1em}
.frac .fd{display:block;padding:.1em .2em 0}

/* Start screen */
.hero{text-align:center;padding:20px 16px 8px}
.langpick .big{font-size:24px}

/* Chat (lesson) */
.lesson{display:flex;flex-direction:column;height:100%}
.ltop{display:flex;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.ltop .t{flex:1;font-weight:800;font-size:16px}
.exit{border:0;background:#EEF1F4;border-radius:16px;padding:6px 12px;min-height:44px;font-weight:700;font-size:14px}
.phases{display:flex;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.ph{flex:1;text-align:center;font-size:11px;font-weight:700;color:#93A7B3;padding:3px 0;border-radius:10px;margin:0 2px;background:#F2F6F8}
.ph.done{color:var(--teal-d);background:var(--teal-l)}
.ph.on{color:#fff;background:var(--teal)}
.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.msg{display:flex;align-items:flex-end;margin-bottom:10px;-webkit-animation:pop .25s ease-out;animation:pop .25s ease-out}
.msg.me{justify-content:flex-end}
.av{flex-shrink:0;margin-right:6px}
html[dir="rtl"] .av{margin-right:0;margin-left:6px}
.bub{max-width:82%;padding:10px 14px;border-radius:20px;background:#fff;box-shadow:0 1px 0 var(--line)}
.msg.z .bub{border-bottom-left-radius:6px}
.msg.me .bub{background:var(--teal);color:#fff;border-bottom-right-radius:6px;font-weight:600}
html[dir="rtl"] .msg.z .bub{border-bottom-left-radius:20px;border-bottom-right-radius:6px}
html[dir="rtl"] .msg.me .bub{border-bottom-right-radius:20px;border-bottom-left-radius:6px}
.pic{margin-top:8px;text-align:center}
.pic svg{max-width:100%;height:auto}
.sumcard{background:var(--sun-l);border:2px dashed #E9B949;border-radius:20px;padding:14px;margin:4px 0 12px}
.sumcard h3{margin:0 0 6px;font-size:20px}
.sumcard ul{margin:0;padding:0 0 0 20px}
html[dir="rtl"] .sumcard ul{padding:0 20px 0 0}
.saved{display:inline-block;margin-top:8px;color:#1F6E43;font-weight:800;font-size:14px}
.dock{background:var(--card);border-top:1px solid var(--line);padding:8px 12px 6px}
.opts{display:flex;flex-wrap:wrap;margin:0 -4px}
.opt{flex:1 1 30%;min-width:28%;min-height:64px;margin:4px;border:2px solid var(--teal);background:#fff;color:var(--ink);border-radius:20px;font-size:22px;font-weight:800;padding:6px}
.opt.wide{flex-basis:100%;font-size:17px;font-weight:700}
.opt:active{background:var(--teal-l)}
.helprow{display:flex;align-items:center;margin-top:4px}
.helprow .big{margin:4px 0;min-height:60px;font-size:18px;flex:1}
.mini{display:flex;flex-wrap:wrap;justify-content:space-between}
.gold{background:none;border:2px dashed var(--lilac);color:#5A45A0;border-radius:16px;font-size:14px;font-weight:700;padding:6px 10px;min-height:44px;margin:2px 0}
.lbfrac{display:flex;align-items:center;justify-content:center;font-size:34px}
.lbfrac .lb{font-size:13px;font-weight:700;color:var(--ink2);text-align:start;text-align:left;margin-left:10px;line-height:1.3}
html[dir="rtl"] .lbfrac .lb{text-align:right;margin-left:0;margin-right:10px}
.lbfrac .lb div{padding:6px 0}

/* Test */
.testv{flex:1;min-height:0;overflow-y:auto;padding:16px}
.pbar{height:22px;background:#E3EEF1;border-radius:12px;overflow:hidden;margin:6px 0 4px;border:2px solid #CFE2E7}
.pfill{height:100%;width:0;background:var(--green);background-image:linear-gradient(90deg,#5CC98B,#3DAA6D);border-radius:10px;-webkit-transition:width .5s ease;transition:width .5s ease}
.qcard{background:#fff;border-radius:22px;padding:16px;margin:12px 0;text-align:center;font-size:19px;font-weight:700}
.result{text-align:center;padding:10px 0}
.result .bigemoji{font-size:54px}
.starsrow{font-size:30px;letter-spacing:4px}

/* Home */
.plan{background:var(--teal);color:#fff;border-radius:24px;padding:16px;margin-bottom:14px}
.plan .lbl{font-size:14px;opacity:.9;font-weight:700}
.plan .what{font-size:20px;font-weight:800;margin:4px 0 6px}
.plan .big{margin-bottom:0}
.statrow{display:flex;margin:0 -6px 14px}
.stat{flex:1;margin:0 6px;background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 2px 0 var(--line)}
.stat b{display:block;font-size:22px}

/* Classes / tests lists */
.tile{display:flex;align-items:center;width:100%;min-height:68px;border:0;background:#fff;border-radius:20px;margin-bottom:10px;padding:10px 14px;box-shadow:0 2px 0 var(--line);text-align:start;text-align:left}
html[dir="rtl"] .tile{text-align:right}
.tile .ti{font-size:30px;width:46px;text-align:center}
.tile .tt{flex:1;font-weight:800;font-size:18px;padding:0 8px}
.tile .tt small{display:block;font-weight:600;color:var(--ink2);font-size:13px}

/* Flashcards */
.fc{display:block;width:100%;min-height:240px;border:0;border-radius:26px;background:#fff;box-shadow:0 4px 0 var(--line);padding:18px;margin:6px 0 12px;font-size:24px;font-weight:800}
.fc.back{background:var(--green-l)}
.fc .side{display:block;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.fc.flip{-webkit-animation:flip .3s ease-out;animation:flip .3s ease-out}
@-webkit-keyframes flip{from{-webkit-transform:scaleX(.2)}to{-webkit-transform:scaleX(1)}}
@keyframes flip{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
.fcnav{display:flex;align-items:center}
.fcnav .big{flex:1;margin:0}
.fcnav .cnt{width:80px;text-align:center;font-weight:800}

/* Parent */
.gate input{width:100%;font-size:26px;text-align:center;padding:12px;border-radius:18px;border:2px solid var(--line);margin:10px 0;direction:ltr}
.seg{display:flex;background:#E3EEF1;border-radius:18px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:14px;min-height:46px;font-weight:700;font-size:15px}
.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.set{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .k{flex:1;font-weight:700}
.step{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.set .v{min-width:74px;text-align:center;font-weight:700}
.set select{font:inherit;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:44px}

/* WhatsApp simulator */
.wa{border-radius:20px;overflow:hidden;box-shadow:0 2px 0 var(--line);background:var(--wa-bg)}
.wahead{background:var(--wa-head);color:#fff;display:flex;align-items:center;padding:8px 12px}
.wahead .n{font-weight:700} .wahead small{display:block;opacity:.85;font-size:12px}
.wahead .avc{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-right:10px}
html[dir="rtl"] .wahead .avc{margin-right:0;margin-left:10px}
.walog{padding:10px 10px 4px;min-height:200px}
.wday{text-align:center;margin:6px 0 10px}
.wday span{background:#E1F2FB;color:#4B6575;font-size:12px;border-radius:8px;padding:3px 10px}
.wm{display:flex;margin-bottom:6px;-webkit-animation:pop .2s ease-out;animation:pop .2s ease-out}
.wm.me{justify-content:flex-end}
.wb{max-width:84%;background:#fff;border-radius:10px;padding:6px 9px 4px;font-size:15px;line-height:1.4;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.wm.me .wb{background:var(--wa-me)}
.wb .tm{display:block;text-align:right;font-size:11px;color:#7A8A93;margin-top:2px}
html[dir="rtl"] .wb .tm{text-align:left}
.waquick{padding:4px 10px 8px}
.waquick .q{display:inline-block;border:1px solid #9BC7B8;background:#fff;color:var(--wa-head);border-radius:18px;padding:8px 14px;margin:3px;font-weight:700;font-size:14px;min-height:40px}
.wacomp{display:flex;align-items:center;padding:8px;background:#F0F0F0}
.wacomp .in{flex:1;background:#fff;border-radius:22px;padding:10px 14px;font-size:15px;min-height:44px;color:var(--ink)}
.wacomp .in.ph{color:#9AA7AE}
.wasend{width:48px;height:48px;border-radius:50%;border:0;background:#00A884;color:#fff;font-size:20px;margin-left:8px}
html[dir="rtl"] .wasend{margin-left:0;margin-right:8px;-webkit-transform:scaleX(-1);transform:scaleX(-1)}
.wasend[disabled]{background:#B9C7CC}
.pulse{-webkit-animation:pulse 1.4s infinite;animation:pulse 1.4s infinite}
@-webkit-keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,168,132,.5)}50%{box-shadow:0 0 0 8px rgba(0,168,132,0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,168,132,.5)}50%{box-shadow:0 0 0 8px rgba(0,168,132,0)}}

/* Help (safety) screen: calm, fixed text */
.helpv{background:#F3F6FD;min-height:100%;padding:18px 16px 24px}
.helpv .lead{font-size:22px;font-weight:800;margin:6px 0}
.hl{background:#fff;border-radius:20px;padding:12px 14px;margin:10px 0;border:2px solid #DCE5FA}
.hl .num{font-size:30px;font-weight:900;color:#2F4FA0;direction:ltr;display:inline-block;letter-spacing:1px}
.hl.first{background:var(--help);color:#fff;border-color:var(--help);font-size:19px;font-weight:700}
.fallback{background:#FFF4D6;border-radius:18px;padding:12px 14px;font-weight:800;margin:12px 0}
.fallback .num{color:#2F4FA0;font-size:24px;direction:ltr;display:inline-block}

@media (prefers-reduced-motion:reduce){
  *{-webkit-animation:none!important;animation:none!important;-webkit-transition:none!important;transition:none!important}
}
</style>
</head>

/* A round man'oushe cut into n parts; k parts have za'atar (green). */
function pie(n, k) {
  var cx = 60, cy = 60, r = 50, out = '', i;
  out += '<svg width="150" height="150" viewBox="0 0 120 120" role="img" aria-label="' + picLabel(n, k) + '">';
  out += '<circle cx="60" cy="60" r="55" fill="#E3B26B"/>';

  } else {
    for (i = 0; i < n; i++) {
      // in Arabic, count (and colour) going the other way round
      var j = rtl() ? (n - 1 - i) : i;
      var a0 = (-90 + j * 360 / n) * Math.PI / 180, a1 = (-90 + (j + 1) * 360 / n) * Math.PI / 180;
      var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      out += '<path d="M60 60 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A50 50 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
        ' Z" fill="' + (i < k ? '#7DB55C' : '#F8DFA8') + '" stroke="#B9874B" stroke-width="2"/>';
    }
  }
  if (k) { // za'atar dots on the green parts look nice but stay simple
    out += '<circle cx="60" cy="60" r="3" fill="#B9874B"/>';
  }

}

}

var SCRIPT = [

  { t: 'say', k: 't3', pic: ['pie', 4, 1] }, { t: 'next' },
  { t: 'say', k: 't4', pic: ['label'] }, { t: 'next' },

  { t: 'q', k: 'c2', pic: ['pie', 3, 1], opts: ['{1/2}', '{1/3}', '{3/1}'], a: 1, hint: 'c2_hint', ex: 'c2_ex', expic: ['pie', 6, 1], look: 'c2_look', ok: 'c2_ok', how: true },
  { t: 'summary', ph: 'summary' }
];

var TESTS = [
  [ { k: 'tq_what', pic: ['pie', 2, 1], opts: ['{1/2}', '{1/4}', '{2/2}'], a: 0 },
    { k: 'tq_what', pic: ['bar', 4, 1], opts: ['{1/3}', '{1/4}', '{4/1}'], a: 1 },

function say(who, k, pic, extra) { L.history.push({ who: who, k: k, pic: pic, extra: extra }); }

/* Walk through the script until we need the child to tap something */
function runLesson() {
  while (L.pos < SCRIPT.length) {
    var st = SCRIPT[L.pos];
    if (st.ph) L.phase = st.ph;
    if (st.t === 'say') { say('z', st.k, st.pic); L.pos++; continue; }
    if (st.t === 'next') { L.pending = { type: 'next', k: st.k || 'b_next' }; return; }
    if (st.t === 'q') { say('z', st.k, st.pic); L.pending = { type: 'q', st: st, tries: 0 }; return; }
    if (st.t === 'summary') {
      say('z', 'sum_intro'); say('card', 'summary');
      S.summarySaved = true;
      L.pending = { type: 'btn', act: 'startTest', k: 'b_test' };
      return;
    }
  }
}
function answer(i) {
  var p = L.pending, st = p.st;
  say('me', st.opts[i]);
  if (i === st.a) {
    say('z', st.ok);
    if (st.how) { say('z', 'how'); L.pending = { type: 'how' }; }
    else { L.pos++; L.pending = null; runLesson(); }
    return;
  }
  p.tries++;
  if (p.tries === 1) say('z', st.hint);                                   // 1st wrong: a hint, never the answer
  else if (p.tries === 2 && st.ex) { say('z', st.ex, st.expic); say('z', 'try_again'); } // 2nd: similar worked example
  else say('z', st.look);                                                 // after that: gentle nudge, still no answer
}
function howReply(i) {
  say('me', 'how' + (i + 1)); say('z', 'how' + (i + 1) + '_r');
  L.pos++; L.pending = null; runLesson();
}
function askForAnswer() {
  say('me', 'me_ask');
  if (L.pending && L.pending.type === 'q') { say('z', 'refuse'); say('z', L.pending.st.hint); }
  else say('z', 'refuse_gen');
}
function startTest(set) {
  L.mode = 'test'; L.phase = 'test'; L.test = { set: set, qi: 0, score: 0 }; L.result = null;
}
function testAnswer(i) {
  var q = TESTS[L.test.set][L.test.qi];
  if (i === q.a) L.test.score++;
  L.test.qi++;
  if (L.test.qi >= 5) finishTest();
}
function finishTest() {
  L.mode = 'result';
  if (L.test.score >= PASS) {
    L.result = 'pass'; S.fracStatus = 'learned'; S.stars += 3; S.practiceScore = L.test.score; L.done = true;
  } else if (L.test.set < 2) {
    L.result = 'retry';
  } else {
    L.result = 'more'; L.done = true;
  }
}

  return '<div class="pad"><h1>📝 ' + t('tst_title') + '</h1><h2>' + t('tst_up') + '</h2>' +
    '<div class="card"><div class="row"><span class="ti" style="font-size:30px;width:46px">📅</span><div class="grow"><b>' + t('tst_frac') + '</b><br><span class="muted">' + t('tst_plan') + '</span></div></div>' +
    '<button class="big b-sun mid" data-act="startLesson">' + t('b_practice') + '</button></div><h2>' + t('tst_past') + '</h2>' + past + '</div>';
}

var CARDS = [
  { f: 'f_what', fp: ['pie', 4, 1], b: 'f_q1b' }, { f: 'f_q2', b: 'f_q2b' }, { f: 'f_q3', b: 'f_q3b' },
  { f: 'f_what', fp: ['bar', 2, 1], b: 'f_q4b' }, { f: 'f_q5', b: 'f_q5b' }
];
function vCards() {
  var c = CARDS[S.cardIdx], side = S.cardBack ? 'back' : 'front';
  var body = S.cardBack ? t(c.b) : (t(c.f) + (c.fp ? '<div class="pic">' + drawPic(c.fp) + '</div>' : ''));
  return '<div class="pad"><h1>🃏 ' + t('crd_title') + '</h1><p class="sub">' + t('crd_sub') + '</p>' +
    '<button class="fc ' + side + (S.cardAnim ? ' flip' : '') + '" data-act="flip" aria-live="polite"><span class="side">' + t('crd_' + side) + '</span>' + body + '</button>' +
    '<p class="muted center">' + t('crd_tap') + '</p>' +
    '<div class="fcnav"><button class="big b-white mid" data-act="card" data-arg="-1">' + t('crd_prev') + '</button>' +
    '<span class="cnt">' + t('crd_count', { i: S.cardIdx + 1, n: CARDS.length }) + '</span>' +
    '<button class="big b-teal mid" data-act="card" data-arg="1">' + t('crd_next') + '</button></div></div>';
}

function vParent() {
  if (!S.parentOpen) {
    return '<div class="pad gate"><div class="card center"><div style="font-size:44px">🔒</div><h1>' + t('gate_title') + '</h1>' +
      '<p>' + t('gate_sub') + '</p><p style="font-size:22px;font-weight:800">“' + t('gate_word') + '”</p>' +
      '<form id="gateform" autocomplete="off"><input id="gatein" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="' + t('gate_ph') + '" aria-label="' + t('gate_ph') + '">' +
      (S.gateWrong ? '<p style="color:#B5462E;font-weight:700" role="alert">' + t('gate_wrong') + '</p>' : '') +
      '<button class="big b-teal" type="submit">' + t('b_gate') + '</button></form></div></div>';
  }
  var seg = '<div class="seg"><button class="' + (S.parentTab === 'settings' ? 'on' : '') + '" data-act="ptab" data-arg="settings">⚙️ ' + t('par_settings') + '</button>' +
    '<button class="' + (S.parentTab === 'wa' ? 'on' : '') + '" data-act="ptab" data-arg="wa">💬 ' + t('par_wa') + '</button></div>';
  var body = S.parentTab === 'settings' ? settingsView() : waView();
  return '<div class="pad"><h1>👪 ' + t('par_title') + '</h1>' + seg + body + '</div>';
}
function settingsView() {
  var opt = function (v) { return '<option value="' + v + '"' + (S.studyTime === v ? ' selected' : '') + '>' + t('tm_' + v) + '</option>'; };
  return '<div class="card"><div class="set"><span class="k">' + t('set_child') + '</span><span>' + t('set_child_v') + '</span></div>' +
    '<div class="set"><span class="k">' + t('set_limit') + '</span><button class="step" data-act="limit" data-arg="-15" aria-label="-">−</button>' +
    '<span class="v">' + t('min', { n: S.limit }) + '</span><button class="step" data-act="limit" data-arg="15" aria-label="+">+</button></div>' +
    '<div class="set"><span class="k">' + t('set_time') + '</span><select id="studytime" aria-label="' + t('set_time') + '">' + opt('16') + opt('17') + opt('18') + '</select></div>' +
    '<div class="set"><span class="k">' + t('set_lang') + '</span><button class="langbtn" data-act="lang">' + t('langBtn') + '</button></div>' +
    '<div class="set" style="display:block"><div class="row"><span class="k">' + t('set_country') + '</span><b>🇱🇧 ' + t('lebanon') + '</b></div>' +
    '<div class="muted">' + t('set_country_note') + '</div></div></div>' +
    '<p class="muted">🤝 ' + t('help_never') + '</p>' +
    '<button class="big b-white mid" data-act="lock">' + t('b_lock') + '</button>' +
    '<button class="linkbtn" data-act="reset">' + t('b_reset') + '</button>';
}
function waView() {
  var i, log = '<div class="wday"><span>' + t('wa_today') + '</span></div>';
  for (i = 0; i < S.wa.log.length; i++) {
    var m = S.wa.log[i];
    if (m.who === 'day') { log += '<div class="wday"><span>' + t(m.k) + '</span></div>'; continue; }
    log += '<div class="wm ' + m.who + '"><div class="wb">' + t(m.k) + '<span class="tm" dir="ltr">' + (rtl() ? m.tm.replace('pm', 'م') : m.tm) + (m.who === 'me' ? ' ✓✓' : '') + '</span></div></div>';
  }
  var quick = '';
  if (S.wa.sent) {
    var cmds = ['REPORT', 'PLAN', 'PAUSE', 'HELP'];
    quick = '<div class="waquick"><div class="muted">' + t('wa_quick') + '</div>';
    for (i = 0; i < cmds.length; i++) quick += '<button class="q" data-act="wacmd" data-arg="' + cmds[i] + '">' + t('q_' + cmds[i]) + '</button>';
    quick += '</div>';
  }
  var comp = S.wa.sent
    ? '<div class="wacomp"><div class="in ph">' + t('wa_type') + '</div><button class="wasend" disabled aria-label="' + t('wa_send') + '">➤</button></div>'
    : '<div class="wacomp"><div class="in">' + t('wa_mom1') + '</div><button class="wasend pulse" data-act="wasend" aria-label="' + t('wa_send') + '">➤</button></div>';
  return (S.wa.sent ? '' : '<p class="muted">👉 ' + t('wa_tap') + '</p>') +
    '<div class="wa"><div class="wahead"><span class="avc">' + mascot(32) + '</span><div><span class="n">' + t('appName') + '</span><small>' + t('wa_sub') + '</small></div></div>' +
    '<div class="walog" id="walog">' + log + '</div>' + quick + comp + '</div><p class="muted">ℹ️ ' + t('wa_policy') + '</p>';
}

function vHelp() {
  return '<div class="helpv">' + '<div class="center">' + mascot(90) + '</div>' +
    '<p class="lead">' + t('help_1') + '</p><p class="lead">' + t('help_2') + '</p>' +
    '<div class="hl first">🤝 ' + t('help_3') + '</div>' +
    '<p style="font-weight:700;margin:16px 0 4px">' + t('help_list') + '</p>' +
    '<div class="hl"><span class="num">112</span><div>' + t('h112') + '</div></div>' +
    '<div class="hl"><span class="num">1564</span><div>' + t('h1564') + '</div></div>' +
    '<div class="hl"><span class="num">03 414 964</span><div>' + t('hhimaya') + '</div></div>' +
    '<div class="fallback">' + t('h_fallback') + ' <span class="num">112</span>.</div>' +
    '<p>📞 ' + t('h_ask') + '</p><p class="muted">' + t('h_note') + '</p>' +
    '<button class="big b-teal" data-act="back">' + t('b_back_zaki') + '</button></div>';
}

/* ------------------------------------------------------------------
   7. Rendering and navigation
------------------------------------------------------------------ */
var TABS = [['home', '🏠'], ['classes', '📚'], ['tests', '📝'], ['cards', '🃏'], ['parent', '👪']];
var VIEWS = { start: vStart, home: vHome, lesson: vLesson, classes: vClasses, tests: vTests, cards: vCards, parent: vParent, help: vHelp };
var prevScreen = 'home', toastTimer = null;

function render() {
  var html = document.documentElement;
  html.lang = S.lang; html.dir = rtl() ? 'rtl' : 'ltr';
  document.title = S.lang === 'ar' ? 'معاينة ذكي' : 'Zaki Preview';
  $('banner').innerHTML = t('banner');
  $('brand').innerHTML = mascot(34) + t('appName');
  $('langbtn').innerHTML = t('langBtn'); $('langbtn').setAttribute('aria-label', t('langAria'));
  $('seen').innerHTML = t('seen');
  $('seen').style.display = (S.screen === 'parent' || S.screen === 'start') ? 'none' : 'block';
  var showTabs = S.screen !== 'start' && S.screen !== 'lesson' && S.screen !== 'help', tabs = '', i;
  if (showTabs) {
    for (i = 0; i < TABS.length; i++) {
      tabs += '<button class="tab' + (S.screen === TABS[i][0] ? ' on' : '') + '" data-act="go" data-arg="' + TABS[i][0] + '"' +
        (S.screen === TABS[i][0] ? ' aria-current="page"' : '') + '><span class="ic" aria-hidden="true">' + TABS[i][1] + '</span>' + t('tab_' + TABS[i][0]) + '</button>';
    }
  }
  $('tabs').innerHTML = tabs; $('tabs').style.display = showTabs ? 'flex' : 'none';
  var main = $('main');
  main.className = 'main' + (S.screen === 'lesson' ? ' lessonmode' : '');
  main.innerHTML = VIEWS[S.screen]();
  S.cardAnim = false;
  var log = $('log'); if (log) log.scrollTop = log.scrollHeight;
  var wl = $('walog'); if (wl) main.scrollTop = main.scrollHeight;
}
function go(screen) {
  if (S.screen === 'parent' && screen !== 'parent') { S.parentOpen = false; S.gateWrong = false; } // re-lock when leaving
  if (screen !== 'help') prevScreen = screen;
  if (screen === 'classes' && S.screen !== 'classes') S.classView = 'list';
  S.screen = screen; render();
  if (screen !== 'lesson') $('main').scrollTop = 0;
}
function toast(msg) {
  var old = document.querySelector('.toast'); if (old) old.parentNode.removeChild(old);
  var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.innerHTML = msg;
  $('phone').appendChild(d);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
}
function setLang(l) {
  S.lang = l;
  try { window.localStorage.setItem('zaki-lang', l); } catch (e) { /* storage not available: fine */ }
  render();
}
function waPush(who, k, tm) { S.wa.log.push({ who: who, k: k, tm: tm }); }

/* One click handler for the whole app (buttons carry data-act) */
document.addEventListener('click', function (ev) {
  var el = ev.target;
  while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
  if (!el || el === document) return;
  var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
  switch (act) {
    case 'lang': setLang(rtl() ? 'en' : 'ar'); break;
    case 'pickLang': S.startStep = 1; setLang(arg); break;
    case 'ready': go('home'); break;
    case 'go': go(arg); break;
    case 'help': prevScreen = S.screen; S.screen = 'help'; render(); $('main').scrollTop = 0; break;
    case 'back': S.screen = prevScreen; render(); break;
    case 'startLesson':
      if (L.done) freshLesson();
      if (!L.started) { L.started = true; if (S.fracStatus === 'new') S.fracStatus = 'learning'; runLesson(); }
      go('lesson'); break;
    case 'next': L.pos++; L.pending = null; runLesson(); render(); break;
    case 'ans': answer(+arg); render(); break;
    case 'how': howReply(+arg); render(); break;
    case 'askAnswer': askForAnswer(); render(); break;
    case 'report': toast('🚩 ' + t('report_thanks')); break;
    case 'startTest': startTest(0); render(); break;
    case 'tans': testAnswer(+arg); render(); break;
    case 'newTest': startTest(L.test.set + 1); render(); break;
    case 'seeClasses': S.classView = 'math'; S.screen = 'classes'; render(); break;
    case 'classView': S.classView = arg; render(); $('main').scrollTop = 0; break;
    case 'flip': S.cardBack = !S.cardBack; S.cardAnim = true; render(); break;
    case 'card': S.cardIdx = (S.cardIdx + (+arg) + CARDS.length) % CARDS.length; S.cardBack = false; S.cardAnim = true; render(); break;
    case 'ptab': S.parentTab = arg; render(); break;
    case 'limit': S.limit = Math.max(15, Math.min(60, S.limit + (+arg))); render(); break;
    case 'lock': S.parentOpen = false; render(); break;
    case 'reset': freshState(); S.startStep = 1; S.screen = 'home'; render(); toast(t('reset_done')); break;
    case 'wasend':
      S.wa.sent = true; waPush('me', 'wa_mom1', '4:02 pm'); render();
      setTimeout(function () { waPush('z', 'wa_z1', '4:02 pm'); render(); }, 700);
      setTimeout(function () { S.wa.log.push({ who: 'day', k: 'wa_later' }); waPush('z', 'wa_report', '6:10 pm'); render(); }, 1500);
      break;
    case 'wacmd': waPush('me', 'q_' + arg, '6:12 pm'); render();
      setTimeout(function () { waPush('z', 'r_' + arg, '6:12 pm'); render(); }, 500);
      break;
  }
});
document.addEventListener('submit', function (ev) {
  if (ev.target.id !== 'gateform') return;
  ev.preventDefault();
  var v = ($('gatein').value || '').replace(/\s/g, '');
  if (v === '742') { S.parentOpen = true; S.gateWrong = false; } else { S.gateWrong = true; }
  render();
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'studytime') { S.studyTime = ev.target.value; render(); }
});

/* Start */
freshState();
try { var saved = window.localStorage.getItem('zaki-lang'); if (saved === 'ar' || saved === 'en') S.lang = saved; } catch (e) { /* ignore */ }
render();

/* For automated checks only (read-only peek; no data leaves the page) */
window.__zaki = { tests: TESTS, script: SCRIPT, state: function () { return { S: S, L: L }; } };
})();
</script>
</body>
</html>
